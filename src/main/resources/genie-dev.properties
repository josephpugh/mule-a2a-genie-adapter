# Local developer overrides for the Genie A2A bridge.
# This file is intended for MUnit and local testing with static auth.

env=dev

genie.agent.slug=genie-demo

genie.workspace.host=https://example.azuredatabricks.net
genie.space.id=space-demo-123
genie.auth.mode=static
genie.auth.token=changeme-local-dev-token
genie.caller.header=X-User-Id

genie.poll.intervalMs=2000
genie.poll.maxAttempts=150
genie.retry.maxAttempts=3
genie.retry.initialMs=500
genie.http.timeoutMs=30000
genie.table.max_rows=200
genie.table.card_rows=20
genie.include_reasoning=false
genie.clarification.detect=true
genie.context.ttl=PT24H
genie.log.content=false

genie.card.name=Genie Demo

genie.card.description=Ask a Databricks Genie space for answers, SQL and table results.
genie.card.url=http://localhost:8081/a2a/genie/genie-demo
genie.card.version=1.0.0
genie.card.provider=Edward Jones

genie.card.skill.name=Ask Genie
genie.card.skill.description=Ask a Genie space to answer questions over the data in Databricks.
genie.card.skill.example1=Which customers bought more than 10 units?
genie.card.skill.example2=Show me the sales trend for the last 30 days.

a2a.listener.port=8081
a2a.agent.path=/a2a/genie/${genie.agent.slug}
